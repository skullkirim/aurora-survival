name: apoca
description: "AURORA - Manual de supervivencia offline / Offline survival guide. PanLabStudios."
publish_to: 'none'
version: 1.7.0+7

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  geolocator: '>=13.0.0 <15.0.0'
  flutter_compass: ^0.8.1
  battery_plus: '>=6.0.0 <8.0.0'
  torch_light: '>=1.1.0 <3.0.0'
  audioplayers: '>=6.0.0 <8.0.0'
  http: '>=1.2.0 <3.0.0'
  path_provider: ^2.1.0
  pdfx: ^2.9.0
  file_picker: ^10.3.0
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.17
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  flutter_local_notifications: ^22.3.3
  timezone: '>=0.10.0 <0.12.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/ill/
    - assets/logo/
